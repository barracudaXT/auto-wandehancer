name: Build and Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs before the check that depends on it: a broken gate now fails CI
      # loudly instead of silently republishing or silently never publishing.
      - name: Test version gate
        run: bash scripts/test-upstream-version-gate.sh

      - name: Check upstream for a newer release
        id: check
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/k1tbyte/Wand-Enhancer/releases/latest \
            | jq -r '.tag_name // empty')

          OUR_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // empty')

          echo "Upstream: ${UPSTREAM_TAG:-none}, Ours: ${OUR_TAG:-none}"

          # Version-aware compare, NOT a string compare: upstream tags plain
          # ("2.1.0.0") and this fork tags with a leading v ("v2.1.0.0"), so
          # "$UPSTREAM_TAG" = "$OUR_TAG" was never true and the 6-hourly schedule
          # reported a new upstream version on every single run -- republishing
          # the same release four times a day. See scripts/upstream-version-gate.sh
          # and its check, scripts/test-upstream-version-gate.sh.
          NEW_VERSION=$(bash scripts/upstream-version-gate.sh "$UPSTREAM_TAG" "$OUR_TAG")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if [ "$NEW_VERSION" = "true" ]; then
            echo "New upstream version detected: $UPSTREAM_TAG"
          else
            echo "Already up to date; nothing to publish."
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync upstream source
        id: sync
        if: needs.check-upstream.outputs.new_version == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          pre_merge=$(git rev-parse HEAD)
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git || true
          git fetch upstream
          git merge upstream/master -X ours --no-edit --allow-unrelated-histories || echo "Merge had conflicts; building with current source."

          if git diff --quiet "$pre_merge" HEAD -- WandEnhancer WandEnhancer.Core AsarSharp web-panel; then
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # Upstream 2.x replaced the signature/regex engine with structural locators, and
      # this fork now builds upstream's own tree at the repository root, so a detected
      # upstream release applies directly instead of being reported as inapplicable.
      # Releases are still versioned from this fork's own assembly version.
      - name: Report upstream sync applicability
        if: needs.check-upstream.outputs.new_version == 'true'
        run: |
          if [ "${{ steps.sync.outputs.src_changed }}" = "true" ]; then
            echo "Upstream ${{ needs.check-upstream.outputs.upstream_tag }} changed the build tree; the build below includes it."
          else
            echo "::notice::Upstream ${{ needs.check-upstream.outputs.upstream_tag }} was detected but does not apply to the build tree. Building this fork's current sources; the release is versioned from this fork's own version, not the upstream tag."
          fi
        shell: bash

      # Node >= 22.19 is required by @lingui/cli 6.3 (ESM-imports globSync from node:fs),
      # which vite.config.ts loads via @lingui/vite-plugin. On Node 20 the config fails to
      # load and `vite build` aborts before any of the build steps below run.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      # Installed as its own step so every later web-panel step (lint, test) and
      # scripts/test-patch-locators.ps1, which resolves esbuild from
      # web-panel\node_modules, run against a populated tree on a clean runner.
      - name: Install web panel dependencies
        working-directory: web-panel
        run: pnpm install --frozen-lockfile

      - name: Lint web panel
        working-directory: web-panel
        run: pnpm lint

      - name: Build web panel
        working-directory: web-panel
        run: pnpm build

      - name: Test web panel
        working-directory: web-panel
        run: pnpm test

      - name: Restore NuGet packages
        run: nuget restore Wand-Enhancer.sln

      - name: Build solution
        run: msbuild Wand-Enhancer.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Test desktop patch state and interop
        shell: pwsh
        run: .\scripts\test-desktop.ps1 -AssemblyPath .\WandEnhancer\bin\Release\WandEnhancer.exe

      - name: Test structural patch locators
        shell: pwsh
        run: .\scripts\test-patch-locators.ps1 -AssemblyPath .\WandEnhancer\bin\Release\WandEnhancer.exe

      - name: Test fork suite
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vstest = & $vswhere -latest -products '*' -find '**\vstest.console.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vstest)) { throw 'vstest.console.exe was not found.' }
          & $vstest `
            '.\WandEnhancer.Core.Tests\bin\Release\WandEnhancer.Core.Tests.dll' `
            '/TestAdapterPath:.\packages\NUnit3TestAdapter.4.6.0\build\net462'
          if ($LASTEXITCODE -ne 0) { throw 'Fork test suite failed.' }

      - name: Determine version
        id: version
        run: |
          # Version the release from this fork's own assembly, not from the
          # upstream tag. These releases currently mirror upstream's numbering,
          # so this yields v2.1.0.0 while upstream tags 2.1.0.0 -- the version
          # gate normalises the leading v and treats the pair as equal.
          # NOTE: the gate compares versions, which only answers "is upstream
          # ahead?" while both lines share one numbering. If this fork ever
          # versions independently, the gate must stop comparing versions and
          # start tracking which upstream tag has been consumed.
          $dll = "WandEnhancer\bin\Release\WandEnhancer.exe"
          $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Validate release metadata
        shell: pwsh
        run: .\scripts\validate-release-metadata.ps1 -ExpectedVersion '${{ steps.version.outputs.tag }}'

      # Signs when SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD repo secrets
      # are set; otherwise the step no-ops and the release stays unsigned.
      # A CA-issued certificate is required for this to clear SmartScreen.
      # The check lives in the script, not in `if:` — the secrets context is not
      # available to a step-level condition and using it invalidates the workflow.
      #
      # The executables are signed BEFORE the installer is built, so the installer
      # packages signed binaries and is itself signed over a deterministic payload.
      # The installer is signed in a second pass afterwards.
      - name: Sign executables
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            Write-Host 'No signing certificate configured - artifacts left unsigned.'
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          & scripts\sign-artifacts.ps1 -Files @(
            'WandEnhancer\bin\Release\WandEnhancer.exe',
            'WandEnhancer.AutoPatch\bin\Release\WandEnhancer.AutoPatch.exe'
          ) -PfxPath $pfx -PfxPassword $env:CERT_PASSWORD

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # Strip the leading "v" (tags carry one) so the version shown in
          # Add/Remove Programs is plain "2.1.0.0".
          $appVersion = "${{ steps.version.outputs.tag }}" -replace '^v',''
          & $iscc "/DMyAppVersion=$appVersion" installer\WandEnhancer.iss
        shell: pwsh

      - name: Sign installer
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) { return }
          & scripts\sign-artifacts.ps1 -Files @('dist\WandEnhancerSetup.exe') `
            -PfxPath (Join-Path $env:RUNNER_TEMP 'signing.pfx') -PfxPassword $env:CERT_PASSWORD
          Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Named for THIS project. The tag stays v<version> because the updater
          # parses it with Version.TryParse after trimming a leading v, so a
          # prefixed tag would not parse and would silently stop updates.
          name: auto-wandehancer ${{ steps.version.outputs.tag }}
          body: |
            Auto-built **auto-wandenhancer** — the pre-built, self-updating fork of
            Wand-Enhancer. Download `WandEnhancerSetup.exe` and run it; it detects
            your Wand/WeMod folder and keeps itself patched from then on.

            ### About this version
            This release tracks upstream's version number, so
            `${{ steps.version.outputs.tag }}` is upstream's version and not a
            separate fork version. The build is this fork's own sources at
            `${{ github.sha }}`.

            ### Changes
            Upstream release notes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
            · [upstream releases](https://github.com/k1tbyte/Wand-Enhancer/releases)
          files: dist/WandEnhancerSetup.exe
          draft: false
          prerelease: false
