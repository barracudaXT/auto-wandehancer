name: Build and Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Check upstream for new releases
        id: check
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/k1tbyte/Wand-Enhancer/releases/latest \
            | jq -r '.tag_name // empty')
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No upstream release found."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUR_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // empty')

          echo "Upstream: $UPSTREAM_TAG, Ours: $OUR_TAG"

          if [ "$UPSTREAM_TAG" = "$OUR_TAG" ]; then
            echo "Already up to date."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream version detected: $UPSTREAM_TAG"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync upstream source
        id: sync
        if: needs.check-upstream.outputs.new_version == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "pre_merge=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git || true
          git fetch upstream
          git merge upstream/master -X ours --no-edit --allow-unrelated-histories || echo "Merge had conflicts; building with current source."
        shell: bash

      # This fork builds src/, but upstream 2.x moved its tree to the repository root,
      # so the merge above can succeed while changing nothing we actually compile.
      # Without this gate the job would publish a release tagged with the new upstream
      # version while shipping the old code. Fail loudly instead — re-basing is a human
      # decision, not something to paper over.
      - name: Verify the sync landed under src
        if: needs.check-upstream.outputs.new_version == 'true'
        run: |
          if git diff --quiet "${{ steps.sync.outputs.pre_merge }}" HEAD -- src/; then
            echo "::error::Upstream ${{ needs.check-upstream.outputs.upstream_tag }} was detected but syncing it changed nothing under src/. The fork builds src/ while upstream 2.x lives at the repository root, so publishing this run would tag unchanged code as the new upstream version. Re-base the fork onto upstream's layout before releasing."
            exit 1
          fi
        shell: bash

      # Node >= 22.19 is required by @lingui/cli 6.3 (ESM-imports globSync from node:fs),
      # which vite.config.ts loads via @lingui/vite-plugin. On Node 20 the config fails to
      # load and `vite build` aborts before any of the build steps below run.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Build native proxy DLL
        working-directory: src
        run: |
          cmake -S tools/asar-fuses-bypass -B .tmp/cmake/asar-fuses-bypass -A x64
          cmake --build .tmp/cmake/asar-fuses-bypass --config Release

      - name: Build web panel
        working-directory: src/web-panel
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore NuGet packages
        working-directory: src
        run: nuget restore Wand-Enhancer.sln

      - name: Build solution
        working-directory: src
        run: msbuild Wand-Enhancer.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Determine version
        id: version
        run: |
          $tag = "${{ needs.check-upstream.outputs.upstream_tag }}"
          if ([string]::IsNullOrEmpty($tag)) {
            $dll = "src\WandEnhancer\bin\Release\WandEnhancer.exe"
            $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
            $tag = "v$ver"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # Strip the leading "v" from the tag (GitHub tags are "v1.0.9.4") so the
          # version shown in Add/Remove Programs is plain "1.0.9.4".
          $appVersion = "${{ steps.version.outputs.tag }}" -replace '^v',''
          & $iscc "/DMyAppVersion=$appVersion" src\installer\WandEnhancer.iss
        shell: pwsh

      # Signs when SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD repo secrets
      # are set; otherwise the step is skipped and the release stays unsigned.
      # A CA-issued certificate is required for this to clear SmartScreen.
      - name: Sign artifacts
        if: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          & src\scripts\sign-artifacts.ps1 -Files @(
            'src\WandEnhancer\bin\Release\WandEnhancer.exe',
            'src\WandEnhancer\bin\Release\AutoPatch\WandEnhancer.AutoPatch.exe',
            'dist\WandEnhancerSetup.exe'
          ) -PfxPath $pfx -PfxPassword $env:CERT_PASSWORD
          Remove-Item $pfx -Force

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WandEnhancer ${{ steps.version.outputs.tag }}
          body: |
            Automated build from upstream release ${{ steps.version.outputs.tag }}.

            ### Changes
            See [upstream release notes](https://github.com/k1tbyte/Wand-Enhancer/releases/tag/${{ steps.version.outputs.tag }}).
          files: dist/WandEnhancerSetup.exe
          draft: false
          prerelease: false
