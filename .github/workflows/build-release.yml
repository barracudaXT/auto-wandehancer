name: Build and Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Check upstream for new releases
        id: check
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/k1tbyte/Wand-Enhancer/releases/latest \
            | jq -r '.tag_name // empty')
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No upstream release found."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUR_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // empty')

          echo "Upstream: $UPSTREAM_TAG, Ours: $OUR_TAG"

          if [ "$UPSTREAM_TAG" = "$OUR_TAG" ]; then
            echo "Already up to date."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream version detected: $UPSTREAM_TAG"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync upstream source
        id: sync
        if: needs.check-upstream.outputs.new_version == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          pre_merge=$(git rev-parse HEAD)
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git || true
          git fetch upstream
          git merge upstream/master -X ours --no-edit --allow-unrelated-histories || echo "Merge had conflicts; building with current source."

          if git diff --quiet "$pre_merge" HEAD -- WandEnhancer WandEnhancer.Core AsarSharp web-panel; then
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # Upstream 2.x replaced the signature/regex engine with structural locators, and
      # this fork now builds upstream's own tree at the repository root, so a detected
      # upstream release applies directly instead of being reported as inapplicable.
      # Releases are still versioned from this fork's own assembly version.
      - name: Report upstream sync applicability
        if: needs.check-upstream.outputs.new_version == 'true'
        run: |
          if [ "${{ steps.sync.outputs.src_changed }}" = "true" ]; then
            echo "Upstream ${{ needs.check-upstream.outputs.upstream_tag }} changed the build tree; the build below includes it."
          else
            echo "::notice::Upstream ${{ needs.check-upstream.outputs.upstream_tag }} was detected but does not apply to the build tree. Building this fork's current sources; the release is versioned from this fork's own version, not the upstream tag."
          fi
        shell: bash

      # Node >= 22.19 is required by @lingui/cli 6.3 (ESM-imports globSync from node:fs),
      # which vite.config.ts loads via @lingui/vite-plugin. On Node 20 the config fails to
      # load and `vite build` aborts before any of the build steps below run.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Build web panel
        working-directory: web-panel
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Restore NuGet packages
        run: nuget restore Wand-Enhancer.sln

      - name: Build solution
        run: msbuild Wand-Enhancer.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Determine version
        id: version
        run: |
          # Always this fork's own version. Adopting the upstream tag would advertise
          # code we do not build, and would make the release look up-to-date to the
          # updater forever (it compares this tag against the upstream tag).
          $dll = "WandEnhancer\bin\Release\WandEnhancer.exe"
          $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # Signs when SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD repo secrets
      # are set; otherwise the step no-ops and the release stays unsigned.
      # A CA-issued certificate is required for this to clear SmartScreen.
      # The check lives in the script, not in `if:` — the secrets context is not
      # available to a step-level condition and using it invalidates the workflow.
      #
      # The executables are signed BEFORE the installer is built, so the installer
      # packages signed binaries and is itself signed over a deterministic payload.
      # The installer is signed in a second pass afterwards.
      - name: Sign executables
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            Write-Host 'No signing certificate configured - artifacts left unsigned.'
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          & scripts\sign-artifacts.ps1 -Files @(
            'WandEnhancer\bin\Release\WandEnhancer.exe',
            'WandEnhancer.AutoPatch\bin\Release\WandEnhancer.AutoPatch.exe'
          ) -PfxPath $pfx -PfxPassword $env:CERT_PASSWORD

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # Strip the leading "v" from the tag (GitHub tags are "v1.0.9.4") so the
          # version shown in Add/Remove Programs is plain "1.0.9.4".
          $appVersion = "${{ steps.version.outputs.tag }}" -replace '^v',''
          & $iscc "/DMyAppVersion=$appVersion" installer\WandEnhancer.iss
        shell: pwsh

      - name: Sign installer
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) { return }
          & scripts\sign-artifacts.ps1 -Files @('dist\WandEnhancerSetup.exe') `
            -PfxPath (Join-Path $env:RUNNER_TEMP 'signing.pfx') -PfxPassword $env:CERT_PASSWORD
          Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WandEnhancer ${{ steps.version.outputs.tag }}
          body: |
            Automated build of this fork, from its own sources.

            ### Changes
            This build reports its own version. For upstream release notes, see
            [upstream releases](https://github.com/k1tbyte/Wand-Enhancer/releases).
          files: dist/WandEnhancerSetup.exe
          draft: false
          prerelease: false
